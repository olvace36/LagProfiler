name: Build LagProfiler

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build LagProfiler.csproj --configuration Release

      - name: Package mod
        run: |
          mkdir -p output/LagProfiler
          cp bin/Release/net9.0/LagProfiler.dll output/LagProfiler/
          cp manifest.json output/LagProfiler/
          cd output && zip -r LagProfiler.zip LagProfiler/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LagProfiler
          path: output/LagProfiler.zip
          
