name: Build LagProfiler

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Check libs/ is present
        run: |
          if [ ! -f "libs/StardewValley.dll" ]; then
            echo "libs/StardewValley.dll not found — commit the Android game DLLs to libs/ (same as SnsAndroidFix), or add a step above to download/unzip them before this point."
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore LagProfiler.csproj

      - name: Build
        run: dotnet build LagProfiler.csproj --configuration Release --no-restore

      # Collect just what the mod folder needs on the phone: the built DLL + manifest.
      - name: Stage mod output
        run: |
          mkdir -p out/LagProfiler
          find bin/Release -name "LagProfiler.dll" -exec cp {} out/LagProfiler/ \;
          cp manifest.json out/LagProfiler/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LagProfiler
          path: out/LagProfiler

